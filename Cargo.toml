[package]
name = "microfont"
version = "8.5.0"
edition = "2024"
license = "MIT"
description = "Dependency-free no_std 6x11 bitmap masks, vector lines and quads, with SVG output."
homepage = "https://github.com/t4ce/MicroFont"
repository = "https://github.com/t4ce/MicroFont"
readme = "README.md"
keywords = ["font", "bitmap", "pixel", "no-std", "embedded"]
categories = ["no-std", "embedded", "graphics", "rendering"]
include = [
    "Cargo.toml",
    "build.rs",
    "README.md",
    "LICENSE",
    "docs/**/*.png",
    "docs/**/*.svg",
    "docs/RELEASE*.md",
    "src/**/*.rs",
    "data/line-v1/**/*.bin",
    "data/line-v1/**/*.md",
    "shaders/**/*.vert",
    "shaders/**/*.frag",
    "shaders/**/*.md",
    "examples/**/*.rs",
    "tools/**/*.py",
    "tools/**/*.rs",
    "tools/**/*.txt",
]

[dependencies]

[features]
default = ["stamp"]
hex = []
stamp = ["hex"]
raster = []

[[example]]
name = "hello_world_bmp"
required-features = ["stamp"]

[[example]]
name = "readme_previews"
required-features = ["stamp"]

[[example]]
name = "atlas_previews"
required-features = ["hex", "raster"]

[[example]]
name = "svg_text"
required-features = ["raster"]

[[example]]
name = "geometry_sink"
required-features = ["raster"]

[package.metadata.docs.rs]
features = ["hex", "raster", "stamp"]

[profile.release]
opt-level = 3
