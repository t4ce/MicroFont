[package]
name = "microfont"
version = "3.9.9"
edition = "2024"
license = "MIT"
description = "MicroFont is a dependency-free no_std 6x11 bitmap and line/quad font."
homepage = "https://github.com/t4ce/MicroFont"
repository = "https://github.com/t4ce/MicroFont"
readme = "README.md"
keywords = ["font", "bitmap", "pixel", "no-std", "embedded"]
categories = ["no-std", "embedded", "graphics", "rendering"]
include = [
    "Cargo.toml",
    "build.rs",
    "README.md",
    "LICENSE",
    "docs/**/*.png",
    "src/**/*.rs",
    "data/line-v1/**/*.bin",
    "data/line-v1/**/*.md",
    "shaders/**/*.vert",
    "examples/**/*.rs",
    "tools/**/*.py",
    "tools/**/*.txt",
]

[dependencies]

[features]
default = ["stamp"]
hex = []
stamp = ["hex"]
raster = []

[[example]]
name = "hello_world_bmp"
required-features = ["stamp"]

[[example]]
name = "readme_previews"
required-features = ["stamp"]

[profile.release]
opt-level = 3
